<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta 
      http-equiv="Content-Security-Policy" 
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" 
    />
    <title>Electron Orbital Visualizer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0f0f11;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #orbital-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      #fps-counter {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2;
        color: #00ffcc;
        font-size: 14px;
        font-weight: bold;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <canvas id="orbital-canvas"></canvas>
    <div id="fps-counter">FPS: 0</div>
    <!-- Note: We are switching from renderer.ts to main.ts -->
    <script type="module" src="./main.ts"></script> 
  </body>
</html>
