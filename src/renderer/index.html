<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta 
      http-equiv="Content-Security-Policy" 
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" 
    />
    <title>Electron Orbital Visualizer</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0f0f11; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
      #orbital-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
      #fps-counter { position: absolute; top: 10px; left: 10px; z-index: 2; color: #00ffcc; font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
      #ui-panel {
        position: absolute; bottom: 20px; left: 20px; z-index: 2;
        background: rgba(15, 15, 17, 0.85); padding: 12px 16px; border-radius: 8px;
        border: 1px solid #333; color: #eee;
      }
      select { background: #222; color: #eee; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; outline: none; }
      #loading { color: #00ffcc; margin-left: 12px; font-size: 14px; display: none; }
    </style>
  </head>
  <body>
    <canvas id="orbital-canvas"></canvas>
    <div id="fps-counter">FPS: 0</div>
    <div id="ui-panel">
      <label for="orbital-select">Orbital: </label>
      <select id="orbital-select">
        <option value="1,0,0">1s</option>
        <option value="2,0,0">2s</option>
        <option value="2,1,0" selected>2p (m=0)</option>
        <option value="3,1,0">3p (m=0)</option>
        <option value="3,2,0">3d (m=0)</option>
      </select>
      <span id="loading">Sampling...</span>
    </div>
    <script type="module" src="./main.ts"></script> 
  </body>
</html>
