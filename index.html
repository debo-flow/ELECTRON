<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electron Orbital Visualizer</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b0f19; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
    .card { max-width: 600px; background: #131a2a; padding: 40px 28px; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; margin-bottom: 12px; font-size: 2rem; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 28px; }
    .btn { display: inline-block; background: #0284c7; color: #fff; text-decoration: none; padding: 14px 28px; border-radius: 8px; font-weight: 600; margin: 6px; }
    .btn-secondary { background: #1e293b; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Electron Orbital Visualizer</h1>
    <p>Interactive 3D desktop app to explore hydrogen atom electron orbitals (1s, 2p, 3d, 4f) as real-time quantum probability clouds.</p>
    <a class="btn" href="https://github.com/debo-flow/ELECTRON/releases">Download v1.0.0</a>
    <a class="btn btn-secondary" href="https://github.com/debo-flow/ELECTRON">View Source on GitHub</a>
  </div>
</body>
</html>
